plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '0.1.0'
group = 'cn.starfall.blueprint'
base { archivesName = 'starfall_blueprint' }
repositories { mavenCentral() }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.1.262'
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', providers.gradleProperty('gameTestNamespaces')
                .getOrElse('starfall_blueprint,starfall_blueprint_servicing,starfall_blueprint_mobility,starfall_blueprint_diagnostics,starfall_blueprint_lingchuan')
        }
    }
    mods { starfall_blueprint { sourceSet(sourceSets.main) } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
